</head><body><div id="host"><canvas></canvas></div><script type="module">
import {createResourceRegistry} from '@scene-engine/display';

 const program={id:'program/color',kind:'program',revision:1,language:'glsl-module@1',stage:'surface',textureSlots:{image:{usage:'color'}},

  const gl=canvas.getContext('webgl2'),pixels=new Uint8Array(canvas.width*canvas.height*4);gl.readPixels(0,0,canvas.width,canvas.height,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
